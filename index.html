<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShashkaPRO AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:16px;
}

h1{
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#9ca3af;
  margin:6px 0 14px;
}

.panel{
  background:#1f2937;
  border-radius:18px;
  padding:14px;
}

.top{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
}

.badge{
  background:#111827;
  border-radius:10px;
  padding:9px 11px;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 13px;
  color:white;
  background:#374151;
  font-weight:bold;
}

.primary{
  background:#2563eb !important;
}

.danger{
  background:#dc2626 !important;
}

#status{
  text-align:center;
  font-weight:bold;
  min-height:24px;
  margin:12px 0;
}

.board{
  width:min(94vw,440px);
  aspect-ratio:1;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border:5px solid #432a1d;
  border-radius:7px;
  overflow:hidden;
}

.cell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.light{
  background:#ead2ad;
}

.dark{
  background:#6b462c;
}

.piece{
  width:72%;
  height:72%;
  border-radius:50%;
  position:relative;
  z-index:2;
  box-shadow:
    inset 0 4px 3px #fff6,
    inset 0 -6px 7px #0009,
    0 3px 5px #0008;
  border:3px solid #222;
}

.white{
  background:#f5f5f5;
  border-color:#aaa;
}

.black{
  background:#171717;
  border-color:#050505;
}

.king:after{
  content:"K";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d4af37;
  font-size:20px;
  font-weight:900;
}

.selected{
  outline:4px solid #22c55e;
  outline-offset:-4px;
}

.target:before{
  content:"";
  width:24%;
  height:24%;
  border-radius:50%;
  background:#22c55e;
  position:absolute;
}

.coord{
  position:absolute;
  font-size:9px;
  opacity:.5;
  font-weight:bold;
}

.rank{
  left:3px;
  top:2px;
}

.file{
  right:3px;
  bottom:2px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.card{
  background:#111827;
  border-radius:11px;
  padding:9px;
  text-align:center;
}

.card b{
  display:block;
  font-size:19px;
  margin-top:3px;
}

#moves{
  max-height:140px;
  overflow:auto;
  margin-top:10px;
  color:#d1d5db;
  font-size:14px;
  line-height:1.6;
}

.bottom{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.bottom button{
  flex:1;
}

.small{
  text-align:center;
  color:#9ca3af;
  font-size:12px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>♟ ShashkaPRO</h1>

<div class="sub">
Oq — siz · Qora — AI
</div>

<div class="panel">

<div class="top">

<div class="badge">
Siz:
<b id="wc">12</b>
</div>

<div class="badge">
AI:
<b id="bc">12</b>
</div>

<button class="primary" id="new">
Yangi o‘yin
</button>

</div>

<div id="status">
Sizning navbatingiz
</div>

<div id="board" class="board"></div>

<div class="info">

<div class="card">
Vaqt
<b id="timer">10:00</b>
</div>

<div class="card">
Yurishlar
<b id="mc">0</b>
</div>

</div>

<div id="moves"></div>

<div class="bottom">

<button id="undo">
↩ Orqaga
</button>

<button class="danger" id="give">
🏳 Taslim
</button>

</div>

<div class="small">
Urish majburiy. K — damka.
</div>

</div>
</div>


<script>

const E=0;
const W=1;
const B=2;
const WK=3;
const BK=4;

const D=[
  [1,1],
  [1,-1],
  [-1,1],
  [-1,-1]
];

let a=[];
let turn=W;
let sel=null;
let tg=[];
let over=false;
let thinking=false;
let hist=[];
let num=0;
let sec=600;
let timer=null;

const $=x=>document.getElementById(x);

function inside(r,c){
  return r>=0 && r<8 && c>=0 && c<8;
}

function copy(x){
  return x.map(r=>r.slice());
}

function col(p){

  if(p===W || p===WK)
    return W;

  if(p===B || p===BK)
    return B;

  return 0;
}

function king(p){
  return p===WK || p===BK;
}


/* DOSKANI BOSHLASH */

function reset(){

  a=Array.from(
    {length:8},
    ()=>Array(8).fill(E)
  );

  // QORA DONALAR
  for(let r=0;r<3;r++){

    for(let c=0;c<8;c++){

      if((r+c)%2===1){

        a[r][c]=B;

      }

    }

  }

  // OQ DONALAR
  for(let r=5;r<8;r++){

    for(let c=0;c<8;c++){

      if((r+c)%2===1){

        a[r][c]=W;

      }

    }

  }

}


/* ODDIY YURISHLAR */

function moves(b,r,c){

  let p=b[r][c];

  let q=col(p);

  let out=[];

  if(!q)
    return out;


  /* DAMKA */

  if(king(p)){

    for(let d of D){

      let x=r+d[0];
      let y=c+d[1];

      let enemy=null;

      while(inside(x,y)){

        if(b[x][y]===E){

          if(enemy){

            out.push({
              r:x,
              c:y,
              cap:enemy
            });

          }

        }
        else{

          if(col(b[x][y])===q || enemy)
            break;

          enemy={
            r:x,
            c:y
          };

        }

        x+=d[0];
        y+=d[1];

      }

    }

  }


  /* ODDIY DONA */

  else{

    let dr=q===W ? -1 : 1;

    for(let dc of [-1,1]){

      let x=r+dr;
      let y=c+dc;

      if(
        inside(x,y) &&
        b[x][y]===E
      ){

        out.push({
          r:x,
          c:y
        });

      }

    }

  }

  return out;
}


/* URISH */

function caps(b,r,c){

  let p=b[r][c];

  let q=col(p);

  let out=[];

  if(!q)
    return out;


  /* DAMKA URISHI */

  if(king(p)){

    for(let d of D){

      let x=r+d[0];
      let y=c+d[1];

      let enemy=null;

      while(inside(x,y)){

        if(b[x][y]===E){

          if(enemy){

            out.push({
              r:x,
              c:y,
              cap:enemy
            });

          }

        }
        else{

          if(
            col(b[x][y])===q ||
            enemy
          ){

            break;

          }

          enemy={
            r:x,
            c:y
          };

        }

        x+=d[0];
        y+=d[1];

      }

    }

  }


  /* ODDIY DONA URISHI */

  else{

    for(let d of D){

      let mr=r+d[0];
      let mc=c+d[1];

      let tr=r+2*d[0];
      let tc=c+2*d[1];

      if(
        inside(tr,tc) &&
        inside(mr,mc) &&
        col(b[mr][mc])===3-q &&
        b[tr][tc]===E
      ){

        out.push({
          r:tr,
          c:tc,
          cap:{
            r:mr,
            c:mc
          }
        });

      }

    }

  }

  return out;
}


/* BARCHA YURISHLAR */

function all(b,q){

  let C=[];
  let N=[];

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      if(col(b[r][c])!==q)
        continue;


      for(let m of caps(b,r,c)){

        C.push({
          from:{r,c},
          ...m,
          cap:true
        });

      }


      for(let m of moves(b,r,c)){

        N.push({
          from:{r,c},
          ...m,
          cap:false
        });

      }

    }

  }

  // URISH BOR BO‘LSA FAQAT URISH
  return C.length ? C : N;
}


/* YURISHNI BAJARISH */

function apply(b,m){

  let n=copy(b);

  let p=n[m.from.r][m.from.c];

  n[m.from.r][m.from.c]=E;

  if(m.cap){

    n[m.cap.r][m.cap.c]=E;

  }


  // OQ DAMKA
  if(
    p===W &&
    m.r===0
  ){

    p=WK;

  }


  // QORA DAMKA
  if(
    p===B &&
    m.r===7
  ){

    p=BK;

  }


  n[m.r][m.c]=p;

  return n;
}


/* YURISH NOMI */

function note(m){

  let f="ABCDEFGH";

  return
    f[m.from.c]+
    (8-m.from.r)+
    "-" +
    f[m.c]+
    (8-m.r)+
    (m.cap ? " ×" : "");

}


/* DOSKANI CHIZISH */

function render(){

  let el=$("board");

  el.innerHTML="";

  let f="ABCDEFGH";


  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      let x=document.createElement("div");

      x.className=
        "cell "+
        ((r+c)%2 ? "dark":"light");


      /* RAQAMLAR */

      if(c===0){

        let z=document.createElement("span");

        z.className="coord rank";

        z.textContent=8-r;

        x.append(z);

      }


      /* HARFLAR */

      if(r===7){

        let z=document.createElement("span");

        z.className="coord file";

        z.textContent=f[c];

        x.append(z);

      }


      /* TANLANGAN DONA */

      if(
        sel &&
        sel.r===r &&
        sel.c===c
      ){

        x.classList.add("selected");

      }


      /* YURISH JOYLARI */

      if(
        tg.some(
          m=>m.r===r && m.c===c
        )
      ){

        x.classList.add("target");

      }


      /* DONA */

      let p=a[r][c];

      if(p){

        let z=document.createElement("div");

        z.className=
          "piece "+
          (
            col(p)===W
            ? "white"
            : "black"
          )+
          (
            king(p)
            ? " king"
            : ""
          );

        x.append(z);

      }


      x.onclick=()=>click(r,c);

      el.append(x);

    }

  }


  /* HISOB */

  let wc=0;
  let bc=0;

  for(let row of a){

    for(let p of row){

      if(col(p)===W)
        wc++;

      if(col(p)===B)
        bc++;

    }

  }

  $("wc").textContent=wc;
  $("bc").textContent=bc;
  $("mc").textContent=num;

  clock();

}


/* O‘YINCHINING BOSISHI */

function click(r,c){

  if(
    over ||
    thinking ||
    turn!==W
  )
    return;


  /* YURISHNI TASDIQLASH */

  if(sel){

    let m=all(a,W).find(

      x=>
        x.from.r===sel.r &&
        x.from.c===sel.c &&
        x.r===r &&
        x.c===c

    );


    if(m){

      hist.push(copy(a));

      a=apply(a,m);

      num++;

      $("moves").innerHTML+=
        `<div>
          ${num}. Siz: ${note(m)}
        </div>`;


      sel=null;
      tg=[];

      turn=B;

      render();

      check();


      if(!over){

        setTimeout(
          ai,
          300
        );

      }

      return;

    }

  }


  /* DONANI TANLASH */

  if(col(a[r][c])===W){

    let ms=
      all(a,W).filter(
        x=>
          x.from.r===r &&
          x.from.c===c
      );


    if(ms.length){

      sel={
        r,
        c
      };

      tg=ms;

      render();

    }

  }

}


/* AI BAHOLASH */

function score(b){

  let s=0;

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      let p=b[r][c];


      if(p===B)
        s+=100;

      if(p===BK)
        s+=180;

      if(p===W)
        s-=100;

      if(p===WK)
        s-=180;

    }

  }

  return s;

}


/* MINIMAX AI */

function mini(
  b,
  d,
  alpha,
  beta,
  max
){

  let ms=
    all(
      b,
      max ? B : W
    );


  if(!ms.length){

    return max
      ? -99999
      : 99999;

  }


  if(d===0)
    return score(b);


  /* AI */

  if(max){

    let v=-1e9;

    for(let m of ms){

      v=Math.max(
        v,
        mini(
          apply(b,m),
          d-1,
          alpha,
          beta,
          false
        )
      );

      alpha=Math.max(
        alpha,
        v
      );

      if(beta<=alpha)
        break;

    }

    return v;

  }


  /* O‘YINCHI */

  else{

    let v=1e9;

    for(let m of ms){

      v=Math.min(
        v,
        mini(
          apply(b,m),
          d-1,
          alpha,
          beta,
          true
        )
      );

      beta=Math.min(
        beta,
        v
      );

      if(beta<=alpha)
        break;

    }

    return v;

  }

}


/* AI YURISHI */

function ai(){

  if(over)
    return;

  thinking=true;

  $("status").textContent=
    "AI o‘ylayapti…";


  setTimeout(()=>{

    let ms=all(a,B);

    let best=-1e9;

    let arr=[];


    for(let m of ms){

      let v=
        mini(
          apply(a,m),
          3,
          -1e9,
          1e9,
          false
        );


      if(v>best){

        best=v;

        arr=[m];

      }

      else if(v===best){

        arr.push(m);

      }

    }


    if(!arr.length){

      end(
        "Siz g‘olib bo‘ldingiz! 🎉"
      );

      return;

    }


    let m=
      arr[
        Math.floor(
          Math.random()*arr.length
        )
      ];


    hist.push(copy(a));

    a=apply(a,m);

    num++;


    $("moves").innerHTML+=
      `<div>
        ${num}. AI: ${note(m)}
      </div>`;


    turn=W;

    thinking=false;

    render();

    check();


    if(!over){

      $("status").textContent=
        "Sizning navbatingiz";

    }

  },250);

}


/* O‘YINNI TEKSHIRISH */

function check(){

  let wm=all(a,W);

  let bm=all(a,B);

  let wc=0;

  let bc=0;


  for(let row of a){

    for(let p of row){

      if(col(p)===W)
        wc++;

      if(col(p)===B)
        bc++;

    }

  }


  if(
    !wc ||
    !wm.length
  ){

    end(
      "AI g‘olib bo‘ldi 🤖"
    );

  }

  else if(
    !bc ||
    !bm.length
  ){

    end(
      "Siz g‘olib bo‘ldingiz! 🎉"
    );

  }

}


/* YAKUN */

function end(t){

  over=true;

  thinking=false;

  $("status").textContent=t;


  if(timer){

    clearInterval(timer);

    timer=null;

  }

}


/* VAQT */

function clock(){

  let m=
    Math.floor(sec/60);

  let s=
    sec%60;


  $("timer").textContent=
    String(m).padStart(2,"0")+
    ":"+
    String(s).padStart(2,"0");

}


/* TIMERNI ISHGA TUSHIRISH */

function startClock(){

  if(timer)
    clearInterval(timer);


  timer=setInterval(()=>{

    if(over)
      return;


    sec--;


    if(sec<=0){

      sec=0;

      clock();

      end(
        "Vaqt tugadi — AI g‘olib 🤖"
      );

    }

    else{

      clock();

    }

  },1000);

}


/* YANGI O‘YIN */

function newGame(){

  reset();

  turn=W;

  sel=null;

  tg=[];

  over=false;

  thinking=false;

  hist=[];

  num=0;

  sec=600;


  $("moves").innerHTML="";

  $("status").textContent=
    "Sizning navbatingiz";


  render();

  startClock();

}


/* YANGI O‘YIN */

$("new").onclick=
  newGame;


/* TASLIM */

$("give").onclick=()=>{

  if(!over){

    end(
      "Siz taslim bo‘ldingiz. AI g‘olib 🤖"
    );

  }

};


/* ORQAGA */

$("undo").onclick=()=>{

  if(
    over ||
    thinking ||
    !hist.length
  )
    return;


  a=hist.pop();

  turn=W;

  sel=null;

  tg=[];

  num=
    Math.max(
      0,
      num-1
    );


  render();


  $("status").textContent=
    "Sizning navbatingiz";

};


/* BOSHLASH */

newGame();

</script>

</body>
</html>
