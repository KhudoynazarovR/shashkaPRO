<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ugolki</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#100c33;color:#fff;font:15px 'Segoe UI',Roboto,system-ui,sans-serif;min-height:100%}
body{padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin:0 52px 10px 0;min-height:44px}
.top .bk{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);font-size:22px}
.top b{font-size:19px}.top small{margin-left:auto;opacity:.7;font-size:12.5px}
.cd{background:#1d1858;border-radius:16px;padding:14px;margin-bottom:10px}
.sec{font-size:12px;letter-spacing:.6px;color:#a9a4d8;font-weight:800;margin:14px 2px 8px}
.big{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;margin-bottom:10px;text-align:left;background:linear-gradient(135deg,#3b2f9e,#251f6e);border:1px solid #4b40c0}
.big .i{font-size:30px}.big b{display:block;font-size:16px}.big small{opacity:.75;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:9px 12px;border-radius:11px;background:#16124a;border:1px solid #3a33a0;font-size:14px;font-weight:600}
.chips button.on{background:#3fa34d;border-color:#3fa34d}
.go{width:100%;padding:13px;border-radius:13px;background:#3fa34d;font-weight:800;font-size:16px;margin-top:10px}
.g2{background:#2a2470}
.pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#1d1858;margin:6px 0}
.pl .av{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.av.w{background:radial-gradient(circle at 35% 30%,#fff,#e8e2d0)}.av.b{background:radial-gradient(circle at 35% 30%,#555,#111)}
.pl .n{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .n small{display:block;font-weight:400;opacity:.72;font-size:11.5px}
.prog{display:flex;gap:2px;margin-top:3px}.prog i{width:9px;height:5px;border-radius:2px;background:rgba(255,255,255,.15)}.prog i.y{background:#ffd257}
.clk{font-family:ui-monospace,monospace;font-size:19px;font-weight:800;padding:4px 9px;border-radius:9px;background:#0b0920;min-width:66px;text-align:center}
.clk.on{background:#3fa34d}.clk.low{background:#e11d48}
.pl.turn{box-shadow:0 0 0 2px #3fa34d inset}
.bd{display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #6b3a1e;border-radius:8px;overflow:hidden;position:relative;touch-action:manipulation;user-select:none}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.l{background:#f0d9b5}.d{background:#b58863}
.c.zm::after{content:'';position:absolute;inset:0;background:rgba(255,90,90,.2);pointer-events:none}
.c.zh::after{content:'';position:absolute;inset:0;background:rgba(80,140,255,.2);pointer-events:none}
.c.lm::before{content:'';position:absolute;inset:0;background:rgba(255,220,0,.38)}
.p{width:78%;height:78%;border-radius:50%;z-index:2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.45);transition:transform .12s}
.p.w{background:radial-gradient(circle at 35% 30%,#fff,#e8e2d0)}.p.b{background:radial-gradient(circle at 35% 30%,#555,#111)}
.c.sel .p{outline:3px solid #3fa34d;outline-offset:1px;transform:scale(1.06)}
.dot{width:30%;height:30%;border-radius:50%;background:rgba(40,150,60,.85);z-index:2}
svg.path{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.info{margin-top:8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12.5px;line-height:1.55;color:#d6d3f5}
.btns{display:flex;gap:8px;margin-top:8px}.btns button{flex:1;padding:11px 4px;border-radius:12px;background:#2a2470;font-size:13.5px;font-weight:700}
.btns button:disabled{opacity:.4}
.st{text-align:center;font-weight:700;margin:6px 0;min-height:20px;font-size:14px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.mod .cd{width:100%;max-width:360px;text-align:center}.mod h2{font-size:24px;margin:6px 0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #3a33a0;background:#16124a;color:#fff;font-size:17px;letter-spacing:3px;text-transform:uppercase;text-align:center}
.code{font-size:30px;font-weight:900;letter-spacing:6px;color:#ffd257;margin:6px 0}
.muted{opacity:.7;font-size:13px}
</style></head><body>
<div id="app"></div>
<script src="/ugcore.js?v=1"></script>
<script>
(function () {
  var A = document.getElementById('app'), W = 1, B = 2;
  function tgw() { try { if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) return Telegram.WebApp; if (window.parent !== window && parent.Telegram && parent.Telegram.WebApp) return parent.Telegram.WebApp; } catch (e) {} return null; }
  function initData() { var w = tgw(); return w ? w.initData : ''; }
  function myName() { try { var u = tgw().initDataUnsafe.user; return u.first_name || u.username || 'Siz'; } catch (e) { return 'Siz'; } }
  function hap(t) { try { var h = tgw().HapticFeedback; if (t === 'sel') h.selectionChanged(); else h.notificationOccurred(t); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var LS = { get: function (k, d) { try { var v = localStorage.getItem('ug_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem('ug_' + k, JSON.stringify(v)); } catch (e) {} } };
  var LV = [[1, '🐣 Shogird', 'boshlovchilar uchun'], [2, '🧑 O‘rtacha', '1 yurish oldindan ko‘radi'], [3, '🧠 Kuchli', '3 yurish oldindan ko‘radi']];
  var TC = [['0', '∞ Vaqtsiz'], ['3+2', '3+2'], ['5+3', '5+3'], ['10+5', '10+5']];
  var G = null;   // joriy o'yin: {mode:'bot'|'net', st, me, lv, hist, sel, ...}
  var WS = null, NET = null, tick = null;

  // ---------- menyu
  function menu() {
    stopNet(); G = null;
    var lv = LS.get('lv', 2), side = LS.get('side', 1), tc = LS.get('tc', '3+2');
    A.innerHTML = '<div class="top"><b>🏁 Ugolki</b></div>' +
      '<div class="cd" style="font-size:13px;line-height:1.55;color:#d6d3f5">🎯 12 donani raqib burchagiga <b>birinchi</b> bo‘lib olib kiring.<br>↔ 1 katak yoki ⤴ dona ustidan sakrash (ketma-ket bir necha marta) · diagonal yo‘q · urish yo‘q<br>⚠️ 40-yurishdan keyin o‘z uyingizda dona qolsa — mag‘lubiyat</div>' +
      '<div class="sec">🤖 BOT BILAN</div><div class="cd"><div class="chips" id="lv">' + LV.map(function (l) { return '<button data-v="' + l[0] + '"' + (l[0] === lv ? ' class="on"' : '') + '>' + l[1] + '</button>'; }).join('') + '</div>' +
      '<div class="muted" id="lvd" style="margin:8px 2px 10px"></div>' +
      '<div class="chips" id="sd"><button data-v="1"' + (side === 1 ? ' class="on"' : '') + '>⚪ Oq (birinchi)</button><button data-v="2"' + (side === 2 ? ' class="on"' : '') + '>⚫ Qora</button></div>' +
      '<button class="go" id="bgo">▶ Boshlash</button></div>' +
      '<div class="sec">👥 DO‘ST BILAN</div><div class="cd"><div class="chips" id="tc">' + TC.map(function (t) { return '<button data-v="' + t[0] + '"' + (t[0] === tc ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div>' +
      '<button class="go" id="ngo">📤 Xona ochish va do‘stga yuborish</button>' +
      '<div style="display:flex;gap:8px;margin-top:10px"><input id="ci" maxlength="6" placeholder="KOD"><button class="go g2" id="jgo" style="margin:0;width:auto;padding:0 18px">Kirish</button></div></div>';
    function pick(id, key, num, cb) { var el = document.getElementById(id); el.onclick = function (e) { var b = e.target.closest('button'); if (!b) return; [].forEach.call(el.children, function (x) { x.classList.toggle('on', x === b); }); var v = b.getAttribute('data-v'); LS.set(key, num ? +v : v); if (cb) cb(); }; }
    function lvd() { var v = LS.get('lv', 2); document.getElementById('lvd').textContent = LV[v - 1][2]; }
    pick('lv', 'lv', 1, lvd); pick('sd', 'side', 1); pick('tc', 'tc', 0); lvd();
    document.getElementById('bgo').onclick = function () { startBot(LS.get('lv', 2), LS.get('side', 1)); };
    document.getElementById('ngo').onclick = function () { net(function () { snd({ type: 'ugCreate', tc: LS.get('tc', '3+2'), init: initData() }); }); waitUi(null); };
    document.getElementById('jgo').onclick = function () { var c = document.getElementById('ci').value.trim().toUpperCase(); if (c.length < 4) return; join(c); };
  }

  // ---------- bot bilan
  function startBot(lv, side) {
    G = { mode: 'bot', st: UG.start(), me: side, lv: lv, hist: [], sel: -1, names: {} };
    G.names[side] = myName(); G.names[3 - side] = LV[lv - 1][1] + ' bot';
    draw(); if (G.st.turn !== G.me) botGo();
  }
  function botGo() {
    if (!G || G.mode !== 'bot' || G.st.over || G.st.turn === G.me) return;
    G.think = true; draw();
    setTimeout(function () {
      if (!G || G.mode !== 'bot') return;
      var m = UG.bot(G.st, G.lv); G.think = false;
      if (!m) UG.pass(G.st); else UG.play(G.st, m.from, m.to);
      hap('sel'); draw(); if (G.st.over) fin(); else if (G.st.turn !== G.me) botGo();
    }, 380 + Math.random() * 350);
  }

  // ---------- onlayn
  function snd(o) { try { WS.send(JSON.stringify(o)); } catch (e) {} }
  function net(cb) {
    if (!initData()) { alert('O‘yinni Telegram ichida (ShashkaPRO bot orqali) oching'); menu(); return; }
    if (WS && WS.readyState === 1) return cb();
    WS = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    WS.onopen = cb;
    WS.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } onNet(m); };
    WS.onclose = function () { WS = null; if (NET && NET.code && !NET.left) setTimeout(function () { if (NET && !NET.left) net(function () { snd({ type: 'ugJoin', code: NET.code, init: initData() }); }); }, 1500); };
  }
  function stopNet() { if (NET && NET.code && WS) snd({ type: 'ugLeave', code: NET.code }); if (NET) NET.left = true; NET = null; try { WS && WS.close(); } catch (e) {} WS = null; }
  function join(code) { NET = { code: code }; waitUi(code); net(function () { snd({ type: 'ugJoin', code: code, init: initData() }); }); }
  function link(code) { return (window.TG_APP_LINK || (parent && parent.TG_APP_LINK) || 'https://t.me/DraughtsPRObot/play') + '?startapp=ug_' + code; }
  function share(code) {
    var t = '🏁 Ugolki o‘ynaymizmi? Bosing — o‘yinga kirasiz!', u = 'https://t.me/share/url?url=' + encodeURIComponent(link(code)) + '&text=' + encodeURIComponent(t), w = tgw();
    if (w && w.openTelegramLink) w.openTelegramLink(u); else window.open(u, '_blank');
  }
  function waitUi(code) {
    A.innerHTML = '<div class="top"><button class="bk" id="bk">‹</button><b>👥 Do‘st kutilmoqda</b></div>' +
      '<div class="cd" style="text-align:center"><div style="font-size:42px">⏳</div>' + (code ? '<div class="muted">Xona kodi</div><div class="code">' + esc(code) + '</div><div class="muted">Do‘stingiz havolani bosishi bilan o‘yin boshlanadi</div><button class="go" id="sh">📤 Do‘stga yuborish</button>' : '<div class="muted">Xona ochilmoqda…</div>') + '</div>';
    document.getElementById('bk').onclick = menu;
    var sh = document.getElementById('sh'); if (sh) sh.onclick = function () { share(code); };
  }
  function onNet(m) {
    if (m.type === 'ugErr') { NET = null; A.innerHTML = '<div class="top"><b>🏁 Ugolki</b></div><div class="cd" style="text-align:center">⚠️ ' + esc(m.msg) + '</div><button class="go g2" id="mn">☰ Menyu</button>'; document.getElementById('mn').onclick = menu; return; }
    if (m.type !== 'ugState') return;
    NET = NET || {}; NET.code = m.code;
    if (m.status === 'wait') { if (!NET.waitShown) { NET.waitShown = 1; waitUi(m.code); } return; }
    var was = G && G.mode === 'net' ? G.st : null, wasOver = was && was.over;
    var st = { b: m.b.split('').map(Number), turn: m.turn, ply: m.ply, last: m.last, pend: m.pend, over: m.res != null, res: m.res, why: m.why };
    G = G && G.mode === 'net' && G.code === m.code ? G : { mode: 'net', code: m.code, sel: -1, names: {} };
    if (G.st && G.st.ply !== st.ply) { G.sel = -1; if (st.turn === m.me) hap('sel'); }
    G.st = st; G.me = m.me || 1; G.watch = !m.me; G.m = m;
    m.players.forEach(function (p) { if (p.side) G.names[p.side] = p.name + (p.on ? '' : ' 📴'); });
    G.clkAt = Date.now(); G.clk = m.clk;
    draw();
    if (st.over && !wasOver) fin(); else if (!st.over && document.getElementById('fin')) document.getElementById('fin').remove();
    if (st.over && m.again && m.again.length) { var a = document.getElementById('agn'); if (a) a.textContent = m.again.indexOf(G.me) >= 0 ? '⏳ Raqib kutilmoqda…' : '🔁 Raqib revansh so‘rayapti — Qabul qilish'; }
  }

  // ---------- doska
  function cellOf(v) { return G.me === W ? 63 - v : v; }   // o'z uyi doim pastki o'ngda
  function fmt(ms) { if (ms == null) return ''; var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function clkNow(side) { if (!G.clk) return null; var v = G.clk[side - 1]; if (!G.st.over && G.st.turn === side) v -= Date.now() - G.clkAt; return Math.max(0, v); }
  function bar(side) {
    var g = UG.inGoal(G.st.b, side), h = '';
    for (var i = 0; i < 12; i++) h += '<i' + (i < g ? ' class="y"' : '') + '></i>';
    var c = clkNow(side), turn = !G.st.over && G.st.turn === side;
    return '<div class="pl' + (turn ? ' turn' : '') + '"><div class="av ' + (side === W ? 'w' : 'b') + '"></div><div class="n">' + esc(G.names[side] || '') + '<small>' + g + '/12 manzilda' + (side === G.me && G.mode === 'bot' ? ' · ' + Math.ceil((G.st.ply + 1) / 2) + '-yurish' : '') + '</small><div class="prog">' + h + '</div></div>' +
      (c != null ? '<div class="clk' + (turn ? (c < 20000 ? ' low' : ' on') : '') + '" data-clk="' + side + '">' + fmt(c) + '</div>' : (turn && G.think ? '<div class="clk on">🤔</div>' : '')) + '</div>';
  }
  function draw() {
    if (!G) return;
    var st = G.st, me = G.me, op = 3 - me, mv = [], last = st.last || [], lastSet = {};
    last.forEach(function (x) { lastSet[x] = 1; });
    var canMove = !st.over && st.turn === me && !G.watch && !(G.mode === 'bot' && G.think);
    if (G.sel >= 0 && canMove) mv = UG.pieceMoves(st.b, G.sel);
    var tgt = {}; mv.forEach(function (m) { tgt[m.to] = m; });
    var h = '<div class="top"><button class="bk" id="bk">‹</button><b>🏁 Ugolki</b><small>' + (G.mode === 'bot' ? '🤖 bot bilan' : (G.m && G.m.tc !== '0' ? G.m.tc : '∞') + ' · do‘st bilan') + '</small></div>';
    h += bar(op) + '<div class="bd" id="bd">';
    for (var v = 0; v < 64; v++) {
      var i = cellOf(v), r = i >> 3, c = i & 7, cls = 'c ' + ((r + c) % 2 ? 'd' : 'l');
      if (UG.goal(me, i)) cls += ' zm'; else if (UG.home(me, i)) cls += ' zh';
      if (lastSet[i] && (i === last[0] || i === last[last.length - 1])) cls += ' lm';
      if (i === G.sel) cls += ' sel';
      h += '<div class="' + cls + '" data-i="' + i + '">' + (st.b[i] ? '<i class="p ' + (st.b[i] === W ? 'w' : 'b') + '"></i>' : tgt[i] ? '<i class="dot"></i>' : '') + '</div>';
    }
    h += '</div>' + bar(me);
    var s = '';
    if (st.over) s = res();
    else if (G.watch) s = '👁 Tomosha';
    else if (st.pend) s = st.turn === me ? '⚡ Oxirgi imkoniyat: shu yurishda to‘ldirsangiz — durang!' : '⚡ Raqibga oxirgi yurish';
    else s = st.turn === me ? 'Sizning navbatingiz' : (G.mode === 'bot' ? '🤖 Bot o‘ylayapti…' : 'Raqib navbati');
    if (!st.over && G.mode === 'net' && G.m && G.m.draw && G.m.draw !== me) s = '🤝 Raqib durang taklif qildi';
    var hm = UG.atHome(st.b, me), left = UG.HOME - Math.ceil(st.ply / 2);
    if (!st.over && hm && left > 0 && left <= 10) s += ' · ⚠️ uyda ' + hm + ' dona, ' + left + ' yurish qoldi';
    h += '<div class="st">' + s + '</div><div class="btns">' +
      (G.mode === 'net' ? '<button id="dr"' + (st.over || G.watch ? ' disabled' : '') + '>🤝 ' + (G.m && G.m.draw && G.m.draw !== me ? 'Qabul' : 'Durang') + '</button>' : '<button id="un"' + (G.hist.length && !st.over ? '' : ' disabled') + '>↩ Ortga</button>') +
      '<button id="rs"' + (st.over || G.watch ? ' disabled' : '') + '>🏳 Taslim</button>' +
      (G.mode === 'bot' ? '<button id="nw">🔄 Yangi</button>' : '') + '</div>';
    A.innerHTML = h;
    // oxirgi sakrash yo'li
    if (last.length > 2) {
      var bd = document.getElementById('bd'), pts = last.map(function (x) { var vv = G.me === W ? 63 - x : x; return ((vv & 7) + .5) + ',' + ((vv >> 3) + .5); }).join(' ');
      bd.insertAdjacentHTML('beforeend', '<svg class="path" viewBox="0 0 8 8"><polyline points="' + pts + '" fill="none" stroke="#e0a800" stroke-width=".1" stroke-dasharray=".22 .12" stroke-linecap="round"/></svg>');
    }
    document.getElementById('bk').onclick = function () { if (!G.st.over && G.mode === 'net' && !G.watch && !confirm('O‘yindan chiqsangiz — mag‘lubiyat. Chiqasizmi?')) return; menu(); };
    document.getElementById('bd').onclick = function (e) { var el = e.target.closest('.c'); if (el) tap(+el.getAttribute('data-i'), tgt); };
    var b;
    if ((b = document.getElementById('un'))) b.onclick = function () { if (!G.hist.length) return; var p = G.hist.pop(); G.st = p; G.sel = -1; draw(); };
    if ((b = document.getElementById('rs'))) b.onclick = function () { if (!confirm('Taslim bo‘lasizmi?')) return; if (G.mode === 'bot') { G.st.over = true; G.st.res = op; G.st.why = 'resign'; draw(); fin(); } else snd({ type: 'ugResign', code: G.code }); };
    if ((b = document.getElementById('dr'))) b.onclick = function () { snd({ type: 'ugDraw', code: G.code }); b.disabled = true; b.textContent = '⏳'; };
    if ((b = document.getElementById('nw'))) b.onclick = function () { startBot(G.lv, G.me); };
  }
  function tap(i, tgt) {
    var st = G.st;
    if (st.over || st.turn !== G.me || G.watch || G.think) return;
    if (st.b[i] === G.me) { G.sel = G.sel === i ? -1 : i; hap('sel'); draw(); return; }
    if (G.sel >= 0 && tgt[i]) {
      var from = G.sel; G.sel = -1;
      if (G.mode === 'bot') {
        G.hist.push(UG.clone(st)); if (G.hist.length > 40) G.hist.shift();
        UG.play(st, from, i); draw(); if (st.over) fin(); else botGo();
      } else { UG.play(st, from, i); draw(); snd({ type: 'ugMove', code: G.code, from: from, to: i }); }
      return;
    }
    G.sel = -1; draw();
  }
  var WHY = { goal: 'hamma donalar manzilda', both: 'ikkalasi ham manzilni to‘ldirdi', home: '40-yurish qoidasi (uyda dona qoldi)', limit: '80 yurish tugadi — manzildagi donalar soni', block: 'yurish qolmadi', resign: 'taslim', time: 'vaqt tugadi', left: 'raqib chiqib ketdi', agree: 'kelishuv bo‘yicha' };
  function res() { var r = G.st.res; return (r === 0 ? '🤝 Durang' : r === G.me ? '🏆 Siz yutdingiz!' : G.watch ? (r === W ? '⚪ Oq yutdi' : '⚫ Qora yutdi') : '😔 Siz yutqazdingiz') + ' — ' + (WHY[G.st.why] || ''); }
  function fin() {
    var r = G.st.res; hap(r === G.me ? 'success' : r === 0 ? 'warning' : 'error');
    if (G.mode === 'bot' && r === G.me) { var w = LS.get('win', {}); w[G.lv] = (w[G.lv] || 0) + 1; LS.set('win', w); }
    var d = document.createElement('div'); d.className = 'mod'; d.id = 'fin';
    d.innerHTML = '<div class="cd"><div style="font-size:48px">' + (r === 0 ? '🤝' : r === G.me ? '🏆' : '😔') + '</div><h2>' + (r === 0 ? 'Durang' : r === G.me ? 'G‘alaba!' : G.watch ? 'O‘yin tugadi' : 'Mag‘lubiyat') + '</h2><div class="muted">' + esc(WHY[G.st.why] || '') + '</div>' +
